site_name: SlideShow
site_description: Cluster annotation viewer for single-cell spatial data
docs_dir: docs
strict: true

nav:
  - Home: index.md
  - User guide: user_guide.md
  - Developer guide: developer_guide.md
  - Bundle format: spec.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.superfences
  - pymdownx.snippets:          # docs/spec.md includes the root SPEC.md, so the format has one source
      base_path: ["."]
      check_paths: true
